buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://plugins.gradle.org/m2/' }
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath 'org.parchmentmc:librarian:1.+'
        classpath 'com.hypherionmc.modutils:modpublisher:2.0.4'
    }
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
if (project.file('../gradletools.gradle').exists()) {
    apply from: '../gradletools.gradle'
} else {
    apply from: 'https://raw.githubusercontent.com/McJtyMods/MultiWorkspace/1.20_tech/gradletools.gradle'
}

group = "com.github.mcjty"
archivesBaseName = "hologui"
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repos()
runs('hologui')
jars('hologui')

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

// ForgeGradle 5 resolves transformed Minecraft jars during project configuration.
// Keep that dependency cache so `clean build` does not delete its own classpath.
tasks.named('clean', Delete).configure {
    setDelete(provider {
        buildDir.listFiles()?.findAll { it != file('build/fg_cache') } ?: []
    })
}

dependencies {
    mc()
    jei()
    top()
    mcjtylib()
}

modpublisher(['the-one-probe'], ['mcjtylib'], ['the-one-probe'], ['mcjtylib'], [])

task apiJar(type: Jar) {
    classifier = "api"
    from(sourceSets.main.output) {
        include "mcjty/hologui/api/**"
    }
}

artifacts {
    archives apiJar
}

publishing {
    tasks.publish.dependsOn 'build'
    publications {
        mavenJava(MavenPublication) {
            artifactId = archivesBaseName
            from components.java
            artifact apiJar
            pom {
                name = 'HoloGui'
                description = 'HoloGui'
                scm {
                    url = 'https://github.com/McJtyMods/HoloGui'
                    connection = 'scm:git:git@github.com:McJtyMods/HoloGui.git'
                    developerConnection = 'scm:git:git@github.com:McJtyMods/HoloGui.git'
                }
                issueManagement {
                    system = 'github'
                    url = 'https://github.com/McJtyMods/HoloGui/issues'
                }
                licenses {
                    license {
                        name = 'MIT'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'McJty'
                        name = 'McJty'
                        roles = ['developer']
                    }
                }
            }
        }
    }

    repositories {
        if (project.hasProperty('mavendir')) {
            maven { url mavendir }
        } else if (System.getenv('local_maven') != null) {
            maven {
                name = 'local'
                url = uri(System.getenv('local_maven'))
            }
        } else {
            mavenLocal()
        }
    }
}


tasks.withType(AbstractPublishToMaven).configureEach {
    dependsOn 'reobfJar'
}
