buildscript {
    repositories {
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.hypherionmc.modutils:modpublisher:2.2.1'
    }
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.4'
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'

def localGradleTools = [
        project.findProperty('gradletools_path') ? file(project.property('gradletools_path')) : null,
        rootProject.file('gradletools.gradle'),
        file('../gradletools.gradle')
].find { it != null && it.exists() }
apply from: localGradleTools ?: 'https://raw.githubusercontent.com/McJtyMods/MultiWorkspace/1.21_neo/gradletools.gradle'


group = "com.github.mcjty"
archivesBaseName = "hologui"
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

if (System.getenv('BUILD_NUMBER') != null) {
    version += "-${System.getenv('BUILD_NUMBER')}"
}

repos()
runs()
jars()

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    mc()
    jei()
    top()
    mcjtylib()
}

// Unpublished dependency artifacts can be staged for standalone verification.
if (project.hasProperty('ariente_dependency_repository')) {
    repositories.maven { url = uri(project.property('ariente_dependency_repository')) }
}

modpublisher(['the-one-probe'], ['mcjtylib'], ['the-one-probe'], ['mcjtylib'], [])

tasks.register('apiJar', Jar) {
    archiveClassifier = 'api'
    from(sourceSets.main.output) { include 'mcjty/hologui/api/**' }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact tasks.apiJar
            artifactId = project.archivesBaseName
        }
    }
    repositories {
        if (project.hasProperty('mavendir')) {
            maven { url = uri(project.property('mavendir')) }
        } else if (System.getenv('local_maven') != null) {
            maven { url = uri(System.getenv('local_maven')) }
        } else {
            mavenLocal()
        }
    }
}

subsystems {
    parchment {
        minecraftVersion = "${parchment_minecraft_version}"
        mappingsVersion = "${parchment_version}"
    }
}

// NeoGradle consumes local mod source sets in development, including transitive mod dependencies.
def localMods = ['McJtyLib', 'TheOneProbe']
localMods.findAll { findProject(":" + it) != null }.each { modName ->
    evaluationDependsOn(":" + modName)
    runs { configureEach { modSource project(":" + modName).sourceSets.main } }
}
